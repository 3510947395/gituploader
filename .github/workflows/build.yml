name: Build GitUploader

on:
  push:
    branches: [main, master]
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "构建完成后发布 GitHub Release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release 标签，例如 v1.0.4"
        required: false
        default: "v1.0.4"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Python wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Build Python source package
        run: python setup.py sdist --dist-dir dist

      - name: Build Debian package
        run: python build_deb.py --prefix /data/data/com.termux/files/usr --output dist/deb

      - name: Verify Debian package
        run: |
          test -f dist/deb/gituploader_1.0.5_all.deb
          file dist/deb/gituploader_1.0.5_all.deb
          dpkg-deb --info dist/deb/gituploader_1.0.5_all.deb
          echo "Debian package: $(pwd)/dist/deb/gituploader_1.0.5_all.deb"
          echo "### Debian package" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "dist/deb/gituploader_1.0.5_all.deb" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          name: GitUploader ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}
          generate_release_notes: true
          files: dist/deb/gituploader_1.0.5_all.deb