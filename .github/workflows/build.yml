name: Build GitUploader

on:
  push:
    branches: [main, master]
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build Python wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Build Python source package
        run: python setup.py sdist --dist-dir dist

      - name: Build Debian package
        run: python build_deb.py --prefix /data/data/com.termux/files/usr --output dist/deb

      - name: Verify Debian package
        run: |
          test -f dist/deb/gituploader_1.0.3_all.deb
          file dist/deb/gituploader_1.0.3_all.deb

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GitUploader ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/deb/*.deb
            dist/*.whl
            dist/*.tar.gz